<svg width="700" height="640" viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Python input and output flow</title>
<desc>Diagram showing how input() sends a prompt to the user and returns a string, and how print() sends data to the screen, plus a note on converting input to numbers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="700" height="640" fill="#FFFFFF"/>

<text x="30" y="36" font-family="sans-serif" font-size="18" font-weight="600" fill="#2C2C2A">Input &amp; Output Flow</text>
<text x="30" y="58" font-family="sans-serif" font-size="12" fill="#5F5E5A">how a program talks to the user</text>

<rect x="30" y="90" width="180" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="120" y="126" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#26215C">Program</text>

<rect x="490" y="90" width="180" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="580" y="126" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#04342C">User</text>

<path d="M210 110 L488 110" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="102" font-family="monospace" font-size="11" text-anchor="middle" fill="#5F5E5A">input("Enter name: ")</text>

<path d="M488 145 L210 145" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="163" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5F5E5A">types "Alice", presses Enter</text>

<text x="30" y="195" font-family="sans-serif" font-size="12" fill="#5F5E5A">Result: always a string -&gt;</text>
<rect x="220" y="178" width="130" height="34" rx="8" fill="#FDEEDC" stroke="#B5651D" stroke-width="0.5"/>
<text x="285" y="200" font-family="monospace" font-size="12" text-anchor="middle" fill="#6B3A0E">"Alice"</text>

<line x1="30" y1="240" x2="670" y2="240" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="30" y="275" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Output with print()</text>

<rect x="30" y="295" width="180" height="60" rx="10" fill="#E5EEFA" stroke="#2B5FA3" stroke-width="0.5"/>
<text x="120" y="331" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#173A61">Program</text>

<path d="M210 325 L488 325" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="317" font-family="monospace" font-size="11" text-anchor="middle" fill="#5F5E5A">print("Hello,", name)</text>

<rect x="490" y="295" width="180" height="60" rx="10" fill="#F1EFE8" stroke="#8A8880" stroke-width="0.5"/>
<text x="580" y="331" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">Screen</text>

<text x="350" y="345" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5F5E5A">Hello, Alice</text>

<line x1="30" y1="390" x2="670" y2="390" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="30" y="425" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">print() parameters</text>
<text x="30" y="455" font-family="monospace" font-size="14" fill="#2C2C2A">print("A", "B", "C", sep="-")</text>
<text x="30" y="475" font-family="sans-serif" font-size="12" fill="#5F5E5A">-&gt; A-B-C   (sep changes what goes between values)</text>
<text x="30" y="505" font-family="monospace" font-size="14" fill="#2C2C2A">print("Loading...", end="")</text>
<text x="30" y="525" font-family="sans-serif" font-size="12" fill="#5F5E5A">-&gt; no newline after   (end changes what comes after)</text>

<line x1="30" y1="555" x2="670" y2="555" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="30" y="588" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Converting input to a number</text>
<text x="30" y="616" font-family="monospace" font-size="14" fill="#2C2C2A">age = int(input("Enter age: "))</text>
</svg>
