<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How Python variables work</title>
<desc>Diagram showing a variable as a label pointing to a value in memory, how reassignment moves the label, and how multiple assignment creates several labels at once.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="620" fill="#FFFFFF"/>

<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">1. Assignment</text>
<text x="40" y="70" font-family="monospace" font-size="16" fill="#2C2C2A">age = 25</text>

<rect x="60" y="100" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="105" y="122" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#26215C">age</text>
<line x1="150" y1="122" x2="228" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230" y="100" width="90" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="122" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">25</text>
<text x="360" y="126" font-family="sans-serif" font-size="12" fill="#5F5E5A">label points to a value in memory</text>

<line x1="40" y1="180" x2="640" y2="180" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="40" y="215" font-family="sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">2. Reassignment</text>
<text x="40" y="245" font-family="monospace" font-size="16" fill="#2C2C2A">age = 30</text>

<rect x="60" y="275" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="105" y="297" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#26215C">age</text>
<path d="M150 297 L190 297 L190 250 L228 250" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230" y="275" width="90" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<text x="275" y="297" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#888780">25</text>
<text x="240" y="335" font-family="sans-serif" font-size="12" fill="#5F5E5A">no longer referenced</text>
<rect x="230" y="205" width="90" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="227" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">30</text>
<text x="360" y="231" font-family="sans-serif" font-size="12" fill="#5F5E5A">the label moves, old value is discarded</text>

<line x1="40" y1="375" x2="640" y2="375" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="40" y="410" font-family="sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">3. Multiple assignment</text>
<text x="40" y="440" font-family="monospace" font-size="16" fill="#2C2C2A">a, b, c = 1, 2, 3</text>

<rect x="60" y="470" width="70" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="95" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#26215C">a</text>
<line x1="130" y1="490" x2="188" y2="490" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="470" width="70" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="225" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">1</text>

<rect x="290" y="470" width="70" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="325" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#26215C">b</text>
<line x1="360" y1="490" x2="418" y2="490" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="470" width="70" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="455" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">2</text>

<rect x="520" y="470" width="60" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#26215C">c</text>
<line x1="580" y1="490" x2="608" y2="490" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610" y="470" width="30" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="625" y="490" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">3</text>

<text x="40" y="550" font-family="sans-serif" font-size="12" fill="#5F5E5A">Each name is its own label, pointing to its own value.</text>
<text x="40" y="572" font-family="sans-serif" font-size="12" fill="#5F5E5A">Purple = variable name, teal = value stored in memory.</text>
</svg>
